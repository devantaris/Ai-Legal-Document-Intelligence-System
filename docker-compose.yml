services:
  db:
    image: pgvector/pgvector:pg16
    container_name: legal_ai_db
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal
      POSTGRES_DB: legal_ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
